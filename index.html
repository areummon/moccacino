<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moccacino</title>
    <link data-trunk rel="rust" data-bin="moccacino" data-wasm-opt="z" />
    <script>
      // wgpu 0.19 commits to WebGPU whenever navigator.gpu exists, even when no adapter is available
      // (blocklisted GPUs, headless), and iced 0.13 cannot pick a backend on the web. Force WebGL2.
      Object.defineProperty(navigator, "gpu", { value: undefined, configurable: true });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f6efe4;
      }
      /* winit follows the canvas's CSS size, so this is what makes the app track the viewport. */
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
      }
      #iced {
        display: flex;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #7d6e60;
      }
    </style>
  </head>
  <body>
    <div id="iced">Loading Moccacino…</div>
  </body>
</html>
