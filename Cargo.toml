[workspace]

members = [
    "moca-data",
    "moca-gui",
]

[package]
name = "moccacino"
version = "0.1.0"
edition = "2021"
authors = ["Moccacino Contributors"]
description = "Software program to experiment with concepts in automata theory and formal languages"
license = "MIT"

[dependencies]
iced = { version = "0.13.1", features = ["canvas", "smol"] }
indexmap = "2.10.0"
moca-data = { path = "./moca-data" }
moca-gui = { path = "./moca-gui" }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# The web build: WebGL2 (iced alone targets only WebGPU) and the browser APIs platform.rs uses.
[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.13.1", features = ["webgl"] }
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["Window", "Document", "Storage", "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url", "Node", "Element", "HtmlElement", "HtmlAnchorElement"] }

[[bin]]
name = "moccacino"
path = "moca-gui/src/main.rs"

# `cargo run` must feel interactive: our own code gets light optimization
# (quick to rebuild), every dependency (iced, wgpu, lyon, cosmic-text) is
# fully optimized once and then cached.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
